{% extends "accounts/_auth_shell.html" %}

{% block title %}Registrarse{% endblock %}

{% block auth_body %}
<form method="post" class="auth-form">
  {% csrf_token %}
  <h2 class="auth-title">Únete a la expedición</h2>
  {% include "accounts/_fields.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary btn-block" type="submit">
    <svg class="icon"><use href="#i-user-plus"/></svg> Crear cuenta
  </button>
</form>
<p class="auth-foot">¿Ya tienes cuenta? <a href="{% url 'accounts:login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Inicia sesión</a>.</p>
{% endblock %}
