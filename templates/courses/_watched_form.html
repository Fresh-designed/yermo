<form method="post" action="{% url 'courses:set_watched' current.pk %}" id="watched-form">
  {% csrf_token %}
  {% if current.watched %}
  <input type="hidden" name="watched" value="0">
  <button class="btn btn-quiet" type="submit">Desmarcar como {% if current.url %}visto{% else %}leída{% endif %}</button>
  {% else %}
  <input type="hidden" name="watched" value="1">
  {% if next_video %}<input type="hidden" name="next_video" value="{{ next_video.pk }}">{% endif %}
  <button class="btn btn-primary" type="submit"><svg class="icon"><use href="#i-check"/></svg> Marcar como {% if current.url %}visto{% else %}leída{% endif %}</button>
  {% endif %}
</form>
